name: Build Godot SailfishOS export templates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'savegame/godot tag to build'
        default: '4.4.1-auroraos-4'
        required: false
      sfos_versions:
        description: 'Comma-separated coderus/sailfishos-platform-sdk tags'
        default: '5.0.0.43,5.1.0.11,5.2.0.15'
        required: false

jobs:
  # Compute the build matrix. On a tag push the inputs are empty, so we fall
  # back to the default set of SFOS releases; on workflow_dispatch the inputs
  # (which carry their own defaults) win.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      godot_tag: ${{ steps.set.outputs.godot_tag }}
    steps:
      - id: set
        run: |
          RAW="${{ github.event.inputs.sfos_versions }}"
          [ -z "$RAW" ] && RAW="5.0.0.43,5.1.0.11,5.2.0.15"
          JSON=$(echo "$RAW" | tr ',' '\n' | tr -d '[:space:]' | grep -v '^$' | jq -R . | jq -cs .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.godot_tag }}"
          echo "godot_tag=${TAG:-4.4.1-auroraos-4}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sfos_version: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # The build needs ~10 GB plus the ~3 GB SDK image; default runner free
      # space is tight, so drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Build export template
        run: |
          GODOT_TAG="${{ needs.setup.outputs.godot_tag }}" \
          SFOS_VERSION="${{ matrix.sfos_version }}" \
          ./1-build-template.sh

      - name: Rename for this SFOS release
        run: mv godot-templates/linux_arm64 "linux_arm64-sfos${{ matrix.sfos_version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux_arm64-sfos${{ matrix.sfos_version }}
          path: linux_arm64-sfos${{ matrix.sfos_version }}
          if-no-files-found: error

  # Publish a GitHub Release with all templates, but only for tag pushes.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Pre-built Godot export templates for SailfishOS (aarch64).

          **Pick the asset matching your device's SailfishOS release.** A template
          built against one release can render incorrectly on another (see the
          README "SailfishOS version compatibility" section).

          | SailfishOS release | Asset |
          |--------------------|-------|
          | 5.0 | `linux_arm64-sfos5.0.0.43` |
          | 5.1 | `linux_arm64-sfos5.1.0.11` |
          | 5.2 | `linux_arm64-sfos5.2.0.15` |

          Download the one for your device, place it at `godot-templates/linux_arm64`
          in your godot-sfos checkout (or point your Godot Linux/X11 export template
          path at it), then skip straight to exporting your game.
          EOF
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" \
            --title "Godot SailfishOS export templates ($TAG)" \
            --notes-file notes.md \
            dist/* \
          || gh release upload "$TAG" dist/* --clobber
